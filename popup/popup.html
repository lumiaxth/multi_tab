<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <h1 data-i18n="appTitle">MultiTab - 网页多开和整理助手</h1>

  <label class="field">
    <span data-i18n="urlLabel">网址</span>
    <input id="urlInput" type="text" data-i18n-placeholder="urlPlaceholder" placeholder="输入网址，留空则使用当前标签页" />
  </label>
  <button id="useCurrentBtn" type="button" data-i18n="useCurrentTab">使用当前标签页</button>

  <label class="field">
    <span data-i18n="countLabel">打开数量（1~16）</span>
    <input id="countInput" type="number" min="1" max="16" value="4" />
  </label>

  <label class="checkbox">
    <input id="fullscreenToggle" type="checkbox" />
    <span data-i18n="biliFullscreen">哔哩哔哩直播自动网页全屏</span>
  </label>

  <label class="checkbox">
    <input id="closeOriginToggle" type="checkbox" />
    <span data-i18n="closeOriginTab">多开后关闭原标签页</span>
  </label>

  <div id="gridHint" class="hint"></div>

  <div class="actions">
    <button id="openBtn" type="button" class="primary" data-i18n="openAndTile">打开并平铺</button>
    <button id="closeAllBtn" type="button" data-i18n="closeGroup">关闭整组窗口</button>
  </div>

  <div class="actions">
    <button id="tileTabsBtn" type="button" data-i18n="tileAllTabs">平铺所有标签页</button>
  </div>

  <div id="statusMsg" class="status"></div>

  <div class="support">
    <a id="sponsorLink" href="#" data-i18n="supportSponsor">❤️ 赞助</a>
    <span class="sep">·</span>
    <a id="reviewLink" href="#" data-i18n="supportReview">⭐ 好评鼓励</a>
  </div>

  <script src="../support.js"></script>
  <script src="popup.js"></script>
</body>
</html>
